<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Rosario del Giorno</title>
    <style>
        :root { --bg: #f2f2f7; --card: #fff; --text: #000; --accent: #007aff; --sub: #6c757d; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #000; --card: #1c1c1e; --text: #fff; --accent: #0a84ff; --sub: #aeaeb2; }
        }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: env(safe-area-inset-top) 16px 20px; touch-action: pan-y; }
        header { padding: 16px 0; }
        .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        h1 { font-size: 28px; margin: 0; }
        .btn-today { background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 6px 12px; font-weight: 600; cursor: pointer; display: none; }
        .nav { display: flex; justify-content: space-between; align-items: center; background: var(--card); border-radius: 12px; padding: 8px 12px; }
        .nav button { background: none; border: none; color: var(--accent); font-size: 22px; cursor: pointer; }
        .sub { font-weight: 600; color: var(--accent); font-size: 15px; }
        .card { background: var(--card); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
        .card h3 { font-size: 16px; color: var(--sub); margin: 0 0 10px; text-transform: uppercase; }
        .card p { font-size: 16px; line-height: 1.5; margin: 0 0 16px; }
        .audio-btn { background: var(--bg); color: var(--accent); border: none; border-radius: 18px; padding: 8px 16px; font-weight: 600; cursor: pointer; }
        .audio-btn.playing { background: var(--accent); color: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="top">
            <h1 id="title">Rosario di Oggi</h1>
            <button id="today-btn" class="btn-today" onclick="goToday()">Oggi</button>
        </div>
        <div class="nav">
            <button onclick="changeDay(-1)">‹</button>
            <span id="subtitle" class="sub">...</span>
            <button onclick="changeDay(1)">›</button>
        </div>
    </header>

    <main id="content"></main>

    <script>
        const rosarioData = {
            gaudiosi: { title: "Misteri Gaudiosi", mysteries: [
                { sub: "1. Luca 1,28-38", text: "Entrando da lei, disse: \"Gioisci, piena di grazia: il Signore è con te\"...", audio: "audio/01_Gaudiosi.mp3" },
                { sub: "2. Luca 1,39-44", text: "In quei giorni Maria si alzò e andò verso la montagna...", audio: "audio/02_Gaudiosi.mp3" },
                { sub: "3. Luca 2,7-20", text: "(Maria) partorì il suo figlio primogenito, lo avvolse in fasce...", audio: "audio/03_Gaudiosi.mp3" },
                { sub: "4. Luca 2,25-35", text: "Ed ecco, c'era un uomo a Gerusalemme, di nome Simeone...", audio: "audio/04_Gaudiosi.mp3" },
                { sub: "5. Luca 2,42-49", text: "Quando egli ebbe dodici anni, essi vi salirono secondo la consuetudine...", audio: "audio/05_Gaudiosi.mp3" }
            ]},
            dolorosi: { title: "Misteri Dolorosi", mysteries: [
                { sub: "1. Luca 22,39-46", text: "E, uscito, andò come di solito al monte degli Ulivi...", audio: "audio/11_Dolorosi.mp3" },
                { sub: "2. Giovanni 18,33-40", text: "Allora Pilato rientrò nel pretorio, chiamò Gesù...", audio: "audio/12_Dolorosi.mp3" },
                { sub: "3. Giovanni 19,2-6", text: "E i soldati, intrecciata una corona di spine...", audio: "audio/13_Dolorosi.mp3" },
                { sub: "4. Luca 23,24-32", text: "E Pilato decise che avvenisse quanto richiedevano...", audio: "audio/14_Dolorosi.mp3" },
                { sub: "5. Luca 23,39-46", text: "E uno dei malfattori appesi alla croce lo bestemmiava...", audio: "audio/15_Dolorosi.mp3" }
            ]},
            gloriosi: { title: "Misteri Gloriosi", mysteries: [
                { sub: "1. Giovanni 20,11-18", text: "Maria invece era rimasta fuori, vicino al sepolcro...", audio: "audio/16_Gloriosi.mp3" },
                { sub: "2. Atti 1,3-11", text: "Egli si mostrò a essi, vivo dopo aver patito...", audio: "audio/17_Gloriosi.mp3" },
                { sub: "3. Giovanni 20,19-23", text: "Essendo quindi la sera di quel giorno, il primo della settimana...", audio: "audio/18_Gloriosi.mp3" },
                { sub: "4. Luca 1,46-49", text: "E disse Maria: \"L'anima mia magnifica il Signore...\"", audio: "audio/19_Gloriosi.mp3" },
                { sub: "5. Apocalisse 12,1-6", text: "Un segno grandioso apparve nel cielo: una donna vestita di sole...", audio: "audio/20_Gloriosi.mp3" }
            ]},
            luminosi: { title: "Misteri Luminosi", mysteries: [
                { sub: "1. Marco 1,4-11", text: "Vi fu Giovanni, che battezzava nel deserto...", audio: "audio/06_Luminosi.mp3" },
                { sub: "2. Giovanni 2,1-10", text: "Il terzo giorno vi fu una festa di nozze a Cana...", audio: "audio/07_Luminosi.mp3" },
                { sub: "3. Marco 1,14-20", text: "E dopo che Giovanni fu arrestato, venne Gesù...", audio: "audio/08_Luminosi.mp3" },
                { sub: "4. Marco 9,1-8", text: "E diceva loro: \"In verità io vi dico...\"", audio: "audio/09_Luminosi.mp3" },
                { sub: "5. Matteo 26,17-28", text: "Il primo giorno degli Azzimi, si avvicinarono i discepoli...", audio: "audio/10_Luminosi.mp3" }
            ]}
        };

        const days = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
        const dayMap = { 1:'gaudiosi', 6:'gaudiosi', 2:'dolorosi', 5:'dolorosi', 3:'gloriosi', 0:'gloriosi', 4:'luminosi' };

        let currDate = new Date();
        let activeAudio = null, activeBtn = null;

        function stopAudio() {
            if (activeAudio) { activeAudio.pause(); activeBtn.classList.remove('playing'); activeBtn.textContent = '▶ Riproduci'; }
            activeAudio = activeBtn = null;
        }

        function toggleAudio(btn, src) {
            if (activeBtn === btn && !activeAudio.paused) return stopAudio();
            stopAudio();
            activeAudio = new Audio(src);
            activeBtn = btn;
            activeAudio.play().catch(() => alert("Audio non disponibile"));
            btn.classList.add('playing');
            btn.textContent = '⏸ Pausa';
            activeAudio.onended = stopAudio;
        }

        function render() {
            stopAudio();
            const isToday = currDate.toDateString() === new Date().toDateString();
            const data = rosarioData[dayMap[currDate.getDay()]];

            document.getElementById('title').textContent = isToday ? "Rosario di Oggi" : "Rosario";
            document.getElementById('today-btn').style.display = isToday ? "none" : "inline-block";
            document.getElementById('subtitle').textContent = `${days[currDate.getDay()]} · ${data.title}`;

            document.getElementById('content').innerHTML = data.mysteries.map((m, i) => `
                <article class="card">
                    <h3>${m.sub}</h3>
                    <p>${m.text}</p>
                    <button class="audio-btn" onclick="toggleAudio(this, '${m.audio}')">▶ Riproduci</button>
                </article>
            `).join('');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function changeDay(offset) { currDate.setDate(currDate.getDate() + offset); render(); }
        function goToday() { currDate = new Date(); render(); }

        // Gestione Swipe snella
        let x0 = 0, y0 = 0;
        document.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive: true});
        document.addEventListener('touchend', e => {
            let dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) changeDay(dx < 0 ? 1 : -1);
        }, {passive: true});

        render();
    </script>
</body>
</html>
