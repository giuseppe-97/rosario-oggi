    <style>
        :root { --bg: #f2f2f7; --card: #fff; --text: #000; --accent: #007aff; --sub: #6c757d; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #000; --card: #1c1c1e; --text: #fff; --accent: #0a84ff; --sub: #aeaeb2; }
        }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); touch-action: pan-y; }
        header { padding: 16px 0; }
        .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        h1 { font-size: 28px; margin: 0; }
        .btn-today { background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 6px 12px; font-weight: 600; cursor: pointer; display: none; }
        .nav { display: flex; justify-content: space-between; align-items: center; background: var(--card); border-radius: 12px; padding: 8px 12px; }
        .nav button { background: none; border: none; color: var(--accent); font-size: 22px; cursor: pointer; }
        .sub { font-weight: 600; color: var(--accent); font-size: 15px; }
        .card { background: var(--card); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
        .card h3 { font-size: 16px; color: var(--sub); margin: 0 0 10px; text-transform: uppercase; }
        .card p { font-size: 16px; line-height: 1.5; margin: 0 0 16px; }
        .audio-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .audio-btn { background: var(--bg); color: var(--accent); border: none; border-radius: 18px; padding: 8px 14px; font-weight: 600; font-size: 13px; cursor: pointer; }
        .audio-btn.playing { background: var(--accent); color: #fff; }

    <main id="content"></main>

    <script>
        const rosarioData = {
            gaudiosi: { title: "Misteri Gaudiosi", mysteries: [
                    { sub: "1. Luca 1,28-38", text: "Entrando da lei, disse: \"Gioisci, piena di grazia: il Signore è con te\". A queste parole ella fu molto turbata e si domandava che senso avesse un saluto simile. L'angelo le disse: \"Non temere, Maria, perché hai trovato grazia presso Dio. Ed ecco, concepirai in ventre e genererai un figlio, e chiamerai il suo nome Gesù. Sarà grande e verrà chiamato Figlio dell'Altissimo, e il Signore Dio gli darà il trono di Davide suo padre, e regnerà sulla casa di Giacobbe per i secoli, e il suo regno non avrà fine”. Allora Maria disse all'angelo: \"Come avverrà questo, poiché non conosco uomo?\". Le rispose l'angelo: \"Lo Spirito Santo scenderà su di te e la potenza dell'Altissimo adombrerà te, e perciò colui che nascerà sarà santo e sarà chiamato Figlio di Dio. Ed ecco, Elisabetta, tua parente, nella sua vecchiaia ha concepito anch'essa un figlio e questo è il sesto mese per lei, che era detta sterile: nulla è impossibile a Dio\". Allora Maria disse: \"Ecco la serva del Signore: avvenga per me secondo la tua parola\".", audio: "audio/01_Gaudiosi.mp3", audioLettura: "audio/Ga1_Lc 1_28-34.mp3" },
                    { sub: "2. Luca 1,39-44", text: "In quei giorni Maria si alzò e andò verso la montagna con fretta, in una città di Giuda, ed entrò nella casa di Zaccaria e salutò Elisabetta. Quando Elisabetta udì il saluto di Maria, il bambino nel suo grembo sussultò. Elisabetta fu riempita di Spirito Santo e a gran voce esclamò: “Benedetta tu fra le donne, e benedetto il frutto del tuo grembo! A che cosa devo che la madre del mio Signore venga da me? Ecco, appena il tuo saluto è giunto ai miei orecchi, il bambino ha sussultato di gioia nel mio grembo. E beata colei che ha creduto nel compimento delle cose a lei dette dal Signore”.", audio: "audio/02_Gaudiosi.mp3", audioLettura: "audio/Ga2_Lc 1_38-43.mp3" },
                    { sub: "3. Luca 2,7-20", text: "(Maria) partorì il suo figlio primogenito, lo avvolse in fasce e lo pose in una mangiatoia, perché per loro non c'era posto nell'alloggio. E c'erano pastori in quella regione, che bivaccavano e vegliavano tutta la notte sul loro gregge. Un angelo del Signore stette con loro e la gloria del Signore lampeggiò intorno a loro, ed essi furono presi da grande timore, e l'angelo disse loro: \"Non temete! Ecco, vi annuncio una grande gioia, che sarà di tutto il popolo: oggi è venuto per voi un Salvatore, che è il Cristo Signore, nella città di Davide. Questo per voi il segno: troverete un bambino in fasce, adagiato in una mangiatoia\". E all’improvviso ci fu con l’angelo una moltitudine dell'esercito celeste, che lodava Dio dicendo: \"Gloria a Dio nell'alto dei cieli e pace in terra agli uomini di buona volontà\". Quando gli angeli si allontanarono da loro, verso il cielo, i pastori dicevano l'un l'altro: \"Andiamo dunque fino a Betlemme, e vediamo questa parola che è avvenuta e che il Signore ci ha fatto conoscere\". Andarono in fretta e trovarono Maria e Giuseppe e il bambino, adagiato nella mangiatoia. Dopo averlo visto, riferirono della parola che era stata detta loro sul bambino. E tutti quelli che udirono si stupirono delle cose dette loro dai pastori. Maria custodiva tutte queste cose, meditandole nel suo cuore. E i pastori ritornarono glorificando e lodando Dio per tutto ciò che avevano udito e visto, com'era stato detto loro.", audio: "audio/03_Gaudiosi.mp3", audioLettura: "audio/Ga3_Lc 2_7-20.mp3" },
                    { sub: "4. Luca 2,25-35", text: "Ed ecco, c'era un uomo a Gerusalemme, di nome Simeone, e quest’uomo era giusto e pio e aspettava la consolazione d'Israele, e lo Spirito Santo era su di lui. Lo Spirito Santo gli aveva rivelato che non avrebbe visto la morte prima di vedere il Cristo del Signore. E venne nello Spirito al tempio e, mentre i genitori introducevano il Bambino Gesù per fare con lui ciò che la Legge prescriveva, egli lo accolse tra le braccia e benedisse Dio, e disse: \"Ora lascia, o Signore, che il tuo servo vada in pace, secondo la tua parola, perché i miei occhi hanno visto la tua salvezza, preparata da te davanti a tutti i popoli, luce per illuminare le genti e gloria del tuo popolo Israele\". E il padre e la madre sua erano meravigliati di quanto si diceva di lui. Simeone li benedisse, e disse a Maria, sua madre: \"Ecco, egli è qui per la caduta e la risurrezione di molti in Israele e come segno di contraddizione, e anche a te una spada trafiggerà l'anima, affinché siano rivelati i pensieri di molti cuori\".", audio: "audio/04_Gaudiosi.mp3", audioLettura: "audio/Ga4_Lc 2_25-30.mp3" },
                    { sub: "5. Luca 2,42-49", text: "Quando egli ebbe dodici anni, essi vi salirono secondo la consuetudine della festa e, trascorsi i giorni, mentre essi ritornavano, il fanciullo Gesù rimase a Gerusalemme, e i genitori non lo sapevano. Pensando che egli fosse nella comitiva, fecero una giornata di viaggio, e poi si misero a cercarlo tra i parenti e i conoscenti; non avendolo trovato, tornarono a Gerusalemme, cercandolo. E dopo tre giorni lo trovarono nel tempio, seduto in mezzo ai maestri, e li ascoltava e li interrogava. E tutti quelli che l'udivano erano pieni di stupore per la sua intelligenza e le sue risposte. Al vederlo restarono stupiti, e sua madre gli disse: \"Figlio, perché ci hai fatto questo? Ecco, tuo padre e io, angosciati, ti cercavamo\". Ed egli rispose loro: \"Perché mi cercavate? Non sapevate che devo essere nelle cose del Padre mio?\".", audio: "audio/05_Gaudiosi.mp3", audioLettura: "audio/Ga5_Lc 2_45-49.mp3" }
            ]},
            dolorosi: { title: "Misteri Dolorosi", mysteries: [
                    { sub: "1. Luca 22,39-46", text: "E, uscito, andò come di solito al monte degli Ulivi; e lo seguirono anche i discepoli. Giunto sul luogo, disse loro: \"Pregate, per non entrare in tentazione\". Ed egli si allontanò da loro quanto un tiro di sasso e, messosi in ginocchio, pregava dicendo: \"Padre, se vuoi, allontana da me questo calice. Tuttavia non sia fatta la mia, ma la tua volontà\". E gli apparve un angelo dal cielo che lo confortava. E, entrato in agonia, pregava più intensamente, e il suo sudore diventò come gocce di sangue che cadevano a terra. E, rialzatosi dalla preghiera, andò dai discepoli e li trovò addormentati per la tristezza. E disse loro: \"Perché dormite? Alzatevi e pregate, per non entrare in tentazione\".", audio: "audio/11_Dolorosi.mp3", audioLettura: "audio/Do1_Lc 22_39-46.mp3" },
                    { sub: "2. Giovanni 18,33-40; 19,1", text: "Allora Pilato rientrò nel pretorio, chiamò Gesù e gli disse: \"Sei tu il re dei Giudei?\". Gesù rispose: \"Dici questo da te, oppure altri te lo dissero di me?\". Rispose Pilato: \"Sono forse io Giudeo? La tua gente e i capi dei sacerdoti ti hanno consegnato a me. Che cosa hai fatto?\". Rispose Gesù: \"Il mio regno non è di questo mondo; se il mio regno fosse di questo mondo, i miei servitori avrebbero combattuto perché non fossi consegnato ai Giudei; ma il mio regno non è di qui\". Allora Pilato gli disse: \"Dunque tu sei re?\". Rispose Gesù: \"Tu lo dici: io sono re. Io per questo sono nato e per questo sono venuto nel mondo: per rendere testimonianza alla verità. Chiunque è dalla verità, ascolta la mia voce\". Gli dice Pilato: \"Che cos'è la verità?\". E, detto questo, uscì di nuovo verso i Giudei e disse loro: \"Io non trovo in lui colpa alcuna. È usanza per voi che io rimetta uno in libertà in occasione della Pasqua per voi: volete dunque che io vi liberi il re dei Giudei?\". Allora essi gridarono di nuovo: \"Non costui, ma Barabba\". Ora, Barabba era un brigante. Allora Pilato prese Gesù e lo fece flagellare.", audio: "audio/12_Dolorosi.mp3", audioLettura: "audio/Do2_Gv 18_33-40_19_1.mp3" },
                    { sub: "3. Giovanni 19,2-6.15", text: "E i soldati, intrecciata una corona di spine, gliela posero sul capo e lo rivestirono di un mantello di porpora, e si avvicinavano a lui e dicevano: \"Salve, re dei Giudei!\". E gli davano schiaffi. Pilato uscì fuori di nuovo e disse loro: \"Ecco, ve lo conduco fuori, perché sappiate che non trovo in lui colpa alcuna\". Allora Gesù uscì, portando la corona di spine e il mantello di porpora. E Pilato disse loro: \"Ecco l'uomo!\". Quando dunque lo videro, i capi dei sacerdoti e le guardie gridarono: \"Crocifiggilo! Crocifiggilo!\". Disse loro Pilato: \"Prendetelo voi e crocifiggetelo; io in lui non trovo colpa\". Allora quelli gridarono: \"Via, via, crocifiggilo!\". Disse loro Pilato: \"Crocifiggerò il vostro re?\". Risposero i capi dei sacerdoti: \"Non abbiamo altro re se non Cesare\".", audio: "audio/13_Dolorosi.mp3", audioLettura: "audio/Do3_Gv 19_2-6.mp3" },
                    { sub: "4. Luca 23,24-32", text: "E Pilato decise che avvenisse quanto richiedevano. E liberò colui che era stato messo in prigione per rivolta e omicidio, e consegnò Gesù al loro volere. E mentre lo conducevano via, presero un certo Simone di Cirene, che veniva dai campi, e gli imposero la croce, da portare dietro a Gesù. Lo seguiva una grande moltitudine di popolo e di donne, che si battevano il petto e gemevano su di lui. Ma Gesù, voltandosi a loro, disse: \"Figlie di Gerusalemme, non piangete su di me, ma piangete su voi stesse e sui vostri figli. Poiché ecco, verranno giorni in cui si dirà: “Beate le sterili, e i grembi che non generarono, e i seni che non allattarono!”. Allora cominceranno a dire ai monti: “Cadete su di noi!”, e alle colline: “Copriteci!”. Poiché, se fanno questo con il legno verde, che avverrà con quello secco?\". Ed erano condotti altri due malfattori che dovevano essere giustiziati insieme a lui.", audio: "audio/14_Dolorosi.mp3", audioLettura: "audio/Do4_Lc 23_20-26.mp3" },
                    { sub: "5. Luca 23,39-46", text: "E uno dei malfattori appesi alla croce lo bestemmiava, dicendo: \"Non sei tu il Cristo? Salva te stesso e noi\". Ma l'altro, rispondendo e rimproverandolo, disse: \"Non temi neppure Dio, tu che sei condannato alla stessa pena? E noi giustamente, perché riceviamo quello che abbiamo meritato per le nostre azioni; ma costui non ha fatto nulla di male\". E disse: \"Gesù, ricordati di me quando entrerai nel tuo regno\". Gli rispose: \"In verità ti dico: oggi con me sarai nel paradiso\". Ed era già circa l'ora sesta e calò l'oscurità su tutta la terra fino alla nona ora, essendo mancato il sole. E il velo del tempio si squarciò a metà. E Gesù, esclamando a gran voce, disse: \"Padre, nelle tue mani affido il mio spirito\". E, detto questo, spirò.", audio: "audio/15_Dolorosi.mp3", audioLettura: "audio/Do5_Lc 23_39-46.mp3" }
            ]},
            gloriosi: { title: "Misteri Gloriosi", mysteries: [
                    { sub: "1. Giovanni 20,11-18", text: "Maria invece era rimasta fuori, vicino al sepolcro, e piangeva. Mentre piangeva, si chinò verso il sepolcro e vide due angeli in bianche vesti, seduti l'uno dalla parte del capo e l'altro dei piedi, dove era stato posto il corpo di Gesù. Ed essi le dissero: \"Donna, perché piangi?\". Rispose loro: \"Hanno portato via il mio Signore e non so dove l'hanno posto\". Detto ciò, si voltò indietro e vide Gesù, in piedi; ma non sapeva che fosse Gesù. Le disse Gesù: \"Donna, perché piangi? Chi cerchi?\". Ella, pensando che fosse il giardiniere, gli disse: \"Signore, se l'hai portato via tu, dimmi dove l'hai posto e io andrò a prenderlo\". Gesù le disse: \"Maria!\". Ella si voltò e gli disse in ebraico: \"Rabbunì!\" - che significa: \"Maestro!\". Gesù le disse: \"Non mi trattenere, perché non sono ancora salito al Padre; ma va' dai miei fratelli e di' loro: “Salgo al Padre mio e Padre vostro, Dio mio e Dio vostro”\". Maria Maddalena andò ad annunciare ai discepoli: \"Ho visto il Signore!\" e ciò che le aveva detto.", audio: "audio/16_Gloriosi.mp3", audioLettura: "audio/Gl1_Gv 20_11-18.mp3" },
                    { sub: "2. Atti 1,3-11", text: "Egli si mostrò a essi, vivo dopo aver patito, con molte prove, durante quaranta giorni, apparendo loro e parlando delle cose riguardanti il regno di Dio. E condividendo il cibo, comandò loro di non allontanarsi da Gerusalemme, ma di attendere l'adempimento della promessa del Padre, “quella - disse - che voi avete udito da me: Giovanni battezzò con acqua, voi invece in Spirito Santo sarete battezzati, tra non molti giorni”. Quelli dunque che erano lì riuniti lo interrogavano dicendo: \"Signore, è in questo tempo che ricostituirai il regno per Israele?\". E disse loro: \"Non spetta a voi conoscere tempi o momenti che il Padre ha posto in suo potere, ma riceverete forza dallo Spirito Santo che scenderà su di voi, e sarete miei testimoni a Gerusalemme, in tutta la Giudea e la Samaria e fino ai confini della terra\". E, dette queste cose, mentre essi lo guardavano, fu elevato in alto e una nube lo sottrasse ai loro occhi. E, mentre essi fissavano il cielo mentre egli andava, ecco che due uomini in bianche vesti si presentarono a loro e dissero: \"Uomini di Galilea, perché state a guardare il cielo? Questo Gesù, che di tra voi è stato elevato in cielo, così verrà nel modo in cui l'avete visto andare in cielo\".", audio: "audio/17_Gloriosi.mp3", audioLettura: "audio/Gl2_At 1_6-11.mp3" },
                    { sub: "3. Giovanni 20,19-23", text: "Essendo quindi la sera di quel giorno, il primo della settimana, mentre le porte del luogo dove si trovavano i discepoli erano chiuse per paura dei Giudei, venne Gesù, e stette in mezzo a loro e disse: \"Pace a voi!\". E, detto questo, mostrò loro le mani e il fianco. Allora i discepoli gioirono vedendo il Signore. Gesù disse loro di nuovo: \"Pace a voi! Come il Padre ha mandato me, anche io mando voi\". Detto questo, soffiò su di loro e disse loro: \"Ricevete lo Spirito Santo. A chi rimettete i peccati, saranno perdonati; a chi li trattenete, saranno trattenuti\".", audio: "audio/18_Gloriosi.mp3", audioLettura: "audio/Gl3_Gv 20_19-23.mp3" },
                    { sub: "4. Luca 1,46-49", text: "E disse Maria: \"L'anima mia magnifica il Signore e il mio spirito esulta in Dio, mio salvatore, perché ha guardato l'umiltà della sua serva. D'ora in poi tutte le generazioni mi chiameranno beata. Grandi cose ha fatto in me l'Onnipotente e Santo è il suo nome: di generazione in generazione la sua misericordia si stende su quelli che lo temono\".", audio: "audio/19_Gloriosi.mp3", audioLettura: "audio/Gl4_Lc 1_46-50.mp3" },
                    { sub: "5. Apocalisse 12,1-6", text: "Un segno grandioso apparve nel cielo: una donna vestita di sole, con la luna sotto i suoi piedi e, sul capo, una corona di dodici stelle. Era incinta, e gridava per le doglie e il travaglio del parto. Allora apparve un altro segno nel cielo: un enorme drago rosso, con sette teste e dieci corna e sulle teste sette diademi; la sua coda trascinava un terzo delle stelle del cielo e le precipitava sulla terra. Il drago si pose davanti alla donna, che stava per partorire, in modo da divorare il bambino appena lo avesse partorito. Essa partorì un figlio maschio, destinato a governare tutte le nazioni con scettro di ferro, e suo figlio fu rapito verso Dio e verso il suo trono. La donna invece fuggì nel deserto, dove Dio le aveva preparato un rifugio perché vi fosse nutrita per milleduecentosessanta giorni.", audio: "audio/20_Gloriosi.mp3", audioLettura: "audio/Gl5_Ap 12_1-6.mp3" }
            ]},
            luminosi: { title: "Misteri Luminosi", mysteries: [
                    { sub: "1. Marco 1,4-11", text: "(...) vi fu Giovanni, che battezzava nel deserto e proclamava un battesimo di conversione per il perdono dei peccati. Accorrevano a lui tutta la regione della Giudea e tutti gli abitanti di Gerusalemme. E si facevano battezzare da lui nel fiume Giordano, confessando i loro peccati. Giovanni era vestito di peli di cammello, con una cintura di pelle attorno ai fianchi, e mangiava cavallette e miele selvatico. E proclamava: \"Viene dopo di me colui che è più forte di me: io non sono degno di chinarmi per slegare i lacci dei suoi sandali. Io vi ho battezzato con acqua, ma egli vi battezzerà in Spirito Santo\". Ed ecco, in quei giorni, Gesù venne da Nazareth di Galilea e fu battezzato nel Giordano da Giovanni. E subito, uscendo dall'acqua, vide squarciarsi i cieli e lo Spirito discendere verso di lui come una colomba. E venne una voce dal cielo: \"Tu sei il Figlio mio, l'amato: in te ho posto il mio compiacimento\".", audio: "audio/06_Luminosi.mp3", audioLettura: "audio/Lu1_Mc 1_4-11.mp3" },
                    { sub: "2. Giovanni 2,1-10", text: "Il terzo giorno vi fu una festa di nozze a Cana di Galilea e c'era la madre di Gesù. Fu invitato alle nozze anche Gesù con i suoi discepoli. E, venuto a mancare il vino, la madre di Gesù disse a lui: \"Non hanno vino\". E Gesù le rispose: \"Donna, che vuoi da me? Non è ancora giunta la mia ora\". Sua madre disse ai servitori: \"Qualsiasi cosa vi dica, fatela\". Vi erano là sei anfore di pietra, poste per la purificazione dei Giudei, della capacità di circa due o tre misure. E Gesù disse loro: \"Riempite d'acqua le anfore\"; e le riempirono fino al colmo. E disse loro di nuovo: \"Ora attingetene e portatene al maestro di tavola\". Ed essi gliene portarono. Quando il maestro di tavola ebbe gustato l'acqua diventata vino - e non sapeva da dove venisse, ma i servitori lo sapevano, quelli che avevano attinto l'acqua - chiamò lo sposo e gli disse: \"Ogni uomo serve prima il vino bello e, quando sono già bevuti, il più scadente. Tu invece hai custodito il vino buono fino a questo momento\".", audio: "audio/07_Luminosi.mp3", audioLettura: "audio/Lu2_Gv 2_1-10.mp3" },
                    { sub: "3. Marco 1,14-20", text: "E dopo che Giovanni fu arrestato, venne Gesù nella Galilea, proclamando il vangelo di Dio, e diceva: \"Il tempo è compiuto e il regno di Dio è qui! Convertitevi, e credete nel Vangelo\". E, camminando lungo il mare di Galilea, vide Simone e Andrea, fratello di Simone, mentre gettavano le reti in mare; erano infatti pescatori. E disse loro Gesù: \"Qui, dietro a me, e vi farò diventare pescatori di uomini\". E subito, lasciate le reti, seguirono lui. E, procedendo un poco, vide Giacomo di Zebedeo e Giovanni, suo fratello, anch'essi nella barca ad aggiustare le reti. E subito li chiamò. Ed essi, lasciando loro padre Zebedeo nella barca con i salariati, andarono dietro a lui.", audio: "audio/08_Luminosi.mp3", audioLettura: "audio/Lu3_Mc 1_14-20.mp3" },
                    { sub: "4. Marco 9,1-8", text: "E diceva loro: \"In verità io vi dico, ci sono alcuni che stanno qui che non gusteranno la morte prima di aver visto il regno di Dio venuto in potenza\". E dopo sei giorni, Gesù prese Pietro, Giacomo e Giovanni e li condusse su un alto monte, in disparte da soli, e fu trasfigurato davanti a loro. E le sue vesti divennero splendenti, bianche molto, quali nessun lavandaio sulla terra può fare così bianche. E fu visto da loro Elia con Mosè ed erano in dialogo con Gesù. E parlando Pietro, disse a Gesù: \"Rabbì, è bello per noi essere qui. E faremo tre tende, una per te, una per Mosè e una per Elia\". Infatti, non sapeva cosa dire, perché erano spaventati. E venne una nube che li copriva d'ombra, e venne una voce dalla nube: \"Questi è il Figlio mio, l'amato: ascoltate lui!\". E all'improvviso, guardandosi attorno, non videro più nessuno, se non il solo Gesù, con loro.", audio: "audio/09_Luminosi.mp3", audioLettura: "audio/Lu4_Mc 9_1-8.mp3" },
                    { sub: "5. Matteo 26,17-19.26-28", text: "Il primo giorno degli Azzimi, si avvicinarono i discepoli a Gesù, dicendo: \"Dove vuoi che ti prepariamo, per mangiare la Pasqua?\". Ed egli rispose: \"Andate in città da un tale e ditegli: “Il Maestro dice: Il mio tempo è vicino; presso di te farò la Pasqua con i miei discepoli”\". E fecero i discepoli come aveva loro ordinato Gesù, e prepararono la Pasqua. Ora, mentre essi mangiavano, Gesù, avendo preso il pane, avendo benedetto, lo spezzò e, dandolo ai discepoli, disse: \"Prendete, mangiate: questo è il mio corpo\". E avendo preso il calice e reso grazie, lo diede loro, dicendo: \"Bevetene tutti, questo infatti è il mio sangue dell'alleanza, versato per molti in remissione dei peccati.”", audio: "audio/10_Luminosi.mp3", audioLettura: "audio/Lu5_Mt 26_17-19.26-28.mp3" }
            ]}
        };

        const days = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
        const dayMap = { 1:'gaudiosi', 6:'gaudiosi', 2:'dolorosi', 5:'dolorosi', 3:'gloriosi', 0:'gloriosi', 4:'luminosi' };

        let currDate = new Date();
        let activeAudio = null, activeBtn = null;

        function stopAudio() {
            if (activeAudio) { 
                activeAudio.pause(); 
                if (activeBtn) {
                    activeBtn.classList.remove('playing'); 
                    activeBtn.textContent = activeBtn.dataset.label || '▶ Commento';
                }
            }
            activeAudio = activeBtn = null;
        }

        function toggleAudio(btn, src) {
            if (!btn.dataset.label) {
                btn.dataset.label = btn.textContent;
            }

            if (activeBtn === btn && !activeAudio.paused) return stopAudio();
            
            stopAudio();
            activeAudio = new Audio(src);
            activeBtn = btn;
            activeAudio.play().catch(() => alert("Audio non disponibile: " + src));
            btn.classList.add('playing');
            btn.textContent = '⏸ Pausa';
            activeAudio.onended = stopAudio;
        }

        function render() {
            stopAudio();
            const isToday = currDate.toDateString() === new Date().toDateString();
            const data = rosarioData[dayMap[currDate.getDay()]];

            document.getElementById('title').textContent = isToday ? "Rosario di Oggi" : "Rosario";
            document.getElementById('today-btn').style.display = isToday ? "none" : "inline-block";
            document.getElementById('subtitle').textContent = `${days[currDate.getDay()]} · ${data.title}`;

            document.getElementById('content').innerHTML = data.mysteries.map((m) => `
                <article class="card">
                    <h3>${m.sub}</h3>
                    <p>${m.text}</p>
                    <div class="audio-group">
                        <button class="audio-btn" onclick="toggleAudio(this, '${m.audioLettura}')">▶ Lettura</button>
                        <button class="audio-btn" onclick="toggleAudio(this, '${m.audio}')">▶ Commento</button>
                        <button class="audio-btn" onclick="toggleAudio(this, 'audio/decina-con-benedetto-xvi.mp3')">▶ Decina con Benedetto XVI</button>
                        <button class="audio-btn" onclick="toggleAudio(this, 'audio/decina-in-gregoriano.mp3')">▶ Decina in gregoriano</button>
                    </div>
                </article>
            `).join('');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function changeDay(offset) { currDate.setDate(currDate.getDate() + offset); render(); }
        function goToday() { currDate = new Date(); render(); }

        // Gestione Swipe
        let x0 = 0, y0 = 0;
        document.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive: true});
        document.addEventListener('touchend', e => {
            let dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) changeDay(dx < 0 ? 1 : -1);
        }, {passive: true});

        render();
    </script>
</body>
</html>
